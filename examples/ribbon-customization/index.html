<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WordCanvas — ribbon customization</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* The editor fills the viewport; in a real app it can be any sized element. */
      #editor {
        position: fixed;
        inset: 0;
      }

      /* A small floating panel that logs custom ribbon events (ctx.emit → the
         `custom` WordCanvas event) so the demo's buttons show a visible effect. */
      #log {
        position: fixed;
        z-index: 15;
        bottom: 10px;
        right: 10px;
        width: 280px;
        max-height: 180px;
        overflow: auto;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #d0d4d9;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #333;
      }
      #log b {
        display: block;
        margin-bottom: 4px;
        font: 600 11px/1.4 system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #80868b;
      }
      #log .empty {
        color: #9aa0a6;
      }

      /* First-load overlay (same pattern as the other examples). */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fafafa;
        font: 14px/1.4 system-ui, sans-serif;
        color: #444;
        transition: opacity 0.3s ease;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #loader .track {
        width: 280px;
        height: 6px;
        border-radius: 3px;
        background: #e4e4e4;
        overflow: hidden;
      }
      #loader .bar {
        height: 100%;
        width: 0;
        border-radius: 3px;
        background: #2563eb;
        transition: width 0.15s ease;
      }
      #loader .label {
        font-variant-numeric: tabular-nums;
      }

      /* Styling for the demo's config/info popups (built with makeFloatingDialog). */
      .demo-dialog {
        position: fixed;
        top: 120px;
        left: 120px;
        width: 260px;
        background: #fff;
        border: 1px solid #c8c6c4;
        border-radius: 8px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        font: 13px/1.5 system-ui, sans-serif;
        overflow: hidden;
      }
      .demo-dialog header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        background: #f3f2f1;
        border-bottom: 1px solid #e1dfdd;
        font-weight: 600;
      }
      .demo-dialog header button {
        margin-left: auto;
        border: none;
        background: transparent;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        color: #605e5c;
      }
      .demo-dialog .body {
        padding: 10px 12px;
      }
    </style>

    <!--
      Resolve the bare package specifier to the built bundle (see embed-offline).
      The path is absolute from the repo root, so serve this example with the repo
      root as the static root (see this folder's README.md); build the lib first.
      In a bundler-based app you'd just `import { WordCanvas } from
      "@forevka/wordcanvas"` and skip this. (The deploy image rewrites this map to
      a sibling library copy — see Dockerfile.web.)
    -->
    <script type="importmap">
      {
        "imports": {
          "@forevka/wordcanvas": "/node_modules/@forevka/wordcanvas/dist-lib/wordcanvas.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="loader">
      <div class="label">Loading editor…</div>
      <div class="track"><div class="bar"></div></div>
    </div>
    <div id="editor"></div>
    <aside id="log"><b>Ribbon events</b><div class="empty">click a custom ribbon button…</div></aside>
    <script type="module" src="./app.js"></script>
  </body>
</html>
