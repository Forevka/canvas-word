<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WordCanvas — document builder playground</title>

    <!--
      Resolves the bare imports in the PRODUCTION build, where the library is
      external (not re-bundled). `npm run build` copies the library's dist-lib
      next to the app as ./wordcanvas. In `vite dev` this map is inert.
    -->
    <script type="importmap">
      {
        "imports": {
          "@forevka/wordcanvas": "./wordcanvas/wordcanvas.js",
          "@forevka/wordcanvas/builder": "./wordcanvas/builder.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      #root {
        display: flex;
        height: 100%;
      }
      #left {
        display: flex;
        flex-direction: column;
        width: 44%;
        min-width: 380px;
        max-width: 720px;
        border-right: 1px solid #d0d4da;
        background: #fafbfc;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid #e2e5ea;
        background: #f1f3f6;
      }
      #toolbar .title {
        font-weight: 600;
        margin-right: auto;
      }
      #toolbar button {
        padding: 4px 10px;
        border: 1px solid #c4c9d1;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      #toolbar button:hover {
        background: #eef1f5;
      }
      #template-name {
        color: #5f6368;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pane-label {
        padding: 5px 10px 3px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: #5f6368;
        border-top: 1px solid #e2e5ea;
      }
      #code {
        flex: 3;
        min-height: 120px;
        overflow: auto;
      }
      #code .cm-editor {
        height: 100%;
        font-size: 12.5px;
      }
      #data {
        flex: 1.4;
        min-height: 90px;
        resize: none;
        border: 0;
        outline: none;
        padding: 8px 10px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12.5px;
        background: #fff;
        color: #202124;
      }
      #status {
        padding: 6px 10px;
        border-top: 1px solid #e2e5ea;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 130px;
        overflow: auto;
      }
      #status.ok {
        color: #188038;
        background: #f2faf4;
      }
      #status.warn {
        color: #9a6700;
        background: #fff9ef;
      }
      #status.error {
        color: #a4373a;
        background: #fdf3f4;
      }
      #editor {
        flex: 1;
        position: relative;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="left">
        <div id="toolbar">
          <span class="title">Builder playground</span>
          <span id="template-name">no template</span>
          <button id="template-btn" title="Load a .docx whose styles/page setup/bands the builder starts from">Load template…</button>
          <button id="template-clear" title="Drop the template" hidden>×</button>
          <input id="template-input" type="file" accept=".docx" hidden />
        </div>
        <div id="code"></div>
        <div class="pane-label">Data (JSON)</div>
        <textarea id="data" spellcheck="false"></textarea>
        <div id="status" class="ok">Ready.</div>
      </div>
      <div id="editor"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
