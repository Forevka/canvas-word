<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WordCanvas — offline embed (no build step)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* The editor mounts its full chrome into this host, so give it a size.
         Here it fills the viewport; in a real app it can be any sized element. */
      #editor {
        position: fixed;
        inset: 0;
      }

      /* First-load overlay. The editor JS chunk + ~9 MB of bundled fonts take a
         moment to stream on a cold load; `onLoadProgress` (see app.js) drives this
         bar so the user sees motion instead of a blank box. Hidden on "ready". */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fafafa;
        font: 14px/1.4 system-ui, sans-serif;
        color: #444;
        transition: opacity 0.3s ease;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #loader .track {
        width: 280px;
        height: 6px;
        border-radius: 3px;
        background: #e4e4e4;
        overflow: hidden;
      }
      #loader .bar {
        height: 100%;
        width: 0;
        border-radius: 3px;
        background: #2563eb;
        transition: width 0.15s ease;
      }
      #loader .label {
        font-variant-numeric: tabular-nums;
      }
    </style>

    <!--
      Resolve the bare package specifier to the built bundle. In a bundler-based
      app you'd just `import { WordCanvas } from "@forevka/wordcanvas"` and skip
      this entirely. Path is absolute from the repo root, so serve this example
      with the repo root as the static root (see this folder's README.md).
    -->
    <script type="importmap">
      {
        "imports": {
          "@forevka/wordcanvas": "/node_modules/@forevka/wordcanvas/dist-lib/wordcanvas.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="loader">
      <div class="label">Loading editor…</div>
      <div class="track"><div class="bar"></div></div>
    </div>
    <div id="editor"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
