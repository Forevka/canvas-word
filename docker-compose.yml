# canvas-word full stack.
#
#   Local dev (DB only — run the app with `npm run dev`):
#       docker compose up -d                 # postgres + flyway
#
#   Full app (production / self-hosted, all four services):
#       docker compose --profile app up -d --build
#
# The backend + web services sit behind the "app" profile so a plain
# `docker compose up -d` keeps the lightweight dev workflow (just the DB),
# while the deploy brings the whole stack up with one flag.
#
# Networking: only `web` publishes a host port (127.0.0.1:${EDGE_PORT:-3003}),
# so the host Caddy terminates TLS for doc-editor.<domain> and proxies to it.
# postgres binds to 127.0.0.1 only; the backend reaches it over the compose
# network and is never exposed to the host.
#
# Vars are CW_-prefixed; copy env.example -> .env to override credentials/ports.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${CW_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CW_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${CW_DB_NAME:-canvasword}
    volumes:
      - ./local-db-data:/var/lib/postgresql/data
    ports:
      # Host-bound to localhost so `npm run dev` can reach it; never public.
      - "127.0.0.1:${CW_DB_PORT:-5544}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CW_DB_USER:-postgres} -d ${CW_DB_NAME:-canvasword}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  flyway:
    image: flyway/flyway:11
    command:
      - -connectRetries=60
      - -locations=filesystem:/flyway/sql
      - repair
      - migrate
    volumes:
      - ./backend/sql/migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: "jdbc:postgresql://postgres:5432/${CW_DB_NAME:-canvasword}"
      FLYWAY_USER: "${CW_DB_USER:-postgres}"
      FLYWAY_PASSWORD: "${CW_DB_PASSWORD:-postgres}"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: canvas-word-backend:latest
    container_name: canvas-word-backend
    restart: unless-stopped
    environment:
      BACKEND_PORT: "8787"
      # In-compose connection: service name `postgres`, container port 5432.
      DATABASE_URL: "postgres://${CW_DB_USER:-postgres}:${CW_DB_PASSWORD:-postgres}@postgres:5432/${CW_DB_NAME:-canvasword}"
      # Dashboard admin (seeded by deploy.ps1 into .env; defaults are dev-only).
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      ADMIN_TOKEN_SECRET: "${ADMIN_TOKEN_SECRET:-dev-insecure-token-secret-change-me}"
      # Public origin used to build the .docx/.pdf download links in webhook payloads.
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8787}"
      SESSION_END_DEBOUNCE_MS: "${SESSION_END_DEBOUNCE_MS:-8000}"
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8787/openapi.json', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.web
    image: canvas-word-web:latest
    container_name: canvas-word-web
    restart: unless-stopped
    # Bind to localhost only — the host Caddy reverse-proxies the subdomain here.
    ports:
      - "127.0.0.1:${EDGE_PORT:-3003}:80"
    depends_on:
      - backend
