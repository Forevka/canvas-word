<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>canvas-word</title>
    <style>
      /* Page reset only — the editor's own styles are injected by WordCanvas and
         the editor chrome is built into <body> by the component. */
      html, body { margin: 0; height: 100%; }

      /* First-load overlay, driven by `onLoadProgress` (see src/main.ts). The
         editor JS chunk + ~9 MB of bundled fonts stream on a cold load; this bar
         shows progress instead of a blank page, and fades out on "ready". */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fafafa;
        font: 14px/1.4 system-ui, sans-serif;
        color: #444;
        transition: opacity 0.3s ease;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      #loader .track {
        width: 280px;
        height: 6px;
        border-radius: 3px;
        background: #e4e4e4;
        overflow: hidden;
      }
      #loader .bar {
        height: 100%;
        width: 0;
        border-radius: 3px;
        background: #2563eb;
        transition: width 0.15s ease;
      }
      #loader .label {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="label">Loading editor…</div>
      <div class="track"><div class="bar"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
